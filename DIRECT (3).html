<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>DIRECT</title>
<style>
:root{--bg:#0b0b12;--card:#15151f;--card2:#1c1c2a;--tx:#fff;--mu:#9a9ab0;--pu:#7c3aed;--pu2:#a855f7;--gr:#22c55e;--rd:#ef4444;--bd:#262636;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050508;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx)}
#app{max-width:430px;height:100%;margin:auto;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
#main{flex:1;overflow-y:auto;padding:14px 16px 24px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px;font-weight:600}
.ib{background:none;border:0;color:var(--tx);font-size:22px;cursor:pointer;padding:4px 8px}
.logo{font-weight:800;letter-spacing:1px;font-size:22px}.logo b{color:var(--pu2)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:6px 0 10px;display:flex;justify-content:space-between}h2 a{color:var(--pu2);font-size:13px;font-weight:500;cursor:pointer}
.mu{color:var(--mu);font-size:12px}.big{font-size:32px;font-weight:700;margin:4px 0}
.row{display:flex;gap:10px}.row>*{flex:1}
.act{background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:12px 4px;text-align:center;font-size:12px;cursor:pointer;color:var(--tx)}
.act i{display:block;font-style:normal;font-size:20px;color:var(--pu2);margin-bottom:4px}
.btn{background:linear-gradient(135deg,var(--pu),var(--pu2));border:0;color:#fff;border-radius:12px;padding:13px;font-weight:600;font-size:15px;width:100%;cursor:pointer}
.btn.s{width:auto;padding:8px 14px;font-size:13px}
.promo{background:linear-gradient(135deg,#2a1560,#1a0f3a);display:flex;justify-content:space-between;align-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd);font-size:13px;cursor:pointer}.li:first-of-type{border-top:0}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pu),#ec4899);display:grid;place-items:center;font-weight:700;flex:none}
.li .g{flex:1}.pos{color:var(--gr)}.neg{color:var(--rd)}
nav{display:flex;justify-content:space-around;align-items:center;background:var(--card);border-top:1px solid var(--bd);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav div{font-size:11px;color:var(--mu);text-align:center;cursor:pointer;min-width:56px}nav div i{display:block;font-style:normal;font-size:20px}
nav .on{color:var(--pu2)}nav .plus{width:48px;height:48px;border-radius:50%;background:var(--pu);color:#fff;display:grid;place-items:center;font-size:26px;margin-top:-22px;box-shadow:0 0 18px #7c3aed88;min-width:0}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.opt.sel{border-color:var(--pu2);background:#1d1433}.opt .ic{font-size:26px;width:44px}.opt .t{flex:1;font-size:13px}.opt .t b{display:block;font-size:15px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--mu)}.sel .radio{border:6px solid var(--pu2)}
input{width:100%;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:12px;color:#fff;font-size:15px;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0}.chip{padding:6px 14px;border-radius:20px;background:var(--card2);font-size:12px;white-space:nowrap;cursor:pointer}.chip.on{background:var(--pu)}
.prod{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;cursor:pointer;font-size:13px}.prod .im{height:90px;display:grid;place-items:center;font-size:48px;background:var(--card2);border-radius:10px;margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sz{display:flex;gap:8px;margin:8px 0 14px}.sz span{flex:1;text-align:center;padding:9px 0;border-radius:10px;background:var(--card2);cursor:pointer;font-size:13px}.sz .on{background:var(--pu)}
.toast{position:absolute;left:16px;right:16px;bottom:90px;background:var(--pu);padding:12px;border-radius:12px;text-align:center;font-size:14px;animation:f 2.2s forwards}@keyframes f{0%,80%{opacity:1}100%{opacity:0}}
select{width:100%;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:12px;color:#fff;font-size:15px;margin-bottom:10px}
#splash{position:absolute;inset:0;z-index:99;background:radial-gradient(circle at 50% 40%,#2a1560,#0b0b12 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
.sw{display:flex;align-items:center;gap:10px}.sn{font-size:clamp(36px,10vw,64px);font-weight:800;letter-spacing:2px;animation:fi .9s both}
.sa{width:clamp(60px,16vw,100px);overflow:visible}.sa path{fill:none;stroke:#a855f7;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px #a855f7);animation:fly 1.5s cubic-bezier(.5,0,.2,1) both}
.sa path:nth-child(1){animation-delay:.9s}.sa path:nth-child(2){animation-delay:1.05s}.sa path:nth-child(3){animation-delay:1.2s}
.stg{margin-top:14px;color:var(--pu2);animation:fi 1s 2.4s both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fly{0%{transform:translate(-360px,-110px);opacity:0}15%{opacity:1}65%{transform:translate(0,-110px)}100%{transform:translate(0,0);opacity:1}}
@media(min-width:600px){#app{max-width:640px}}
@media(min-width:900px){body{background:radial-gradient(circle at 20% 0,#1d1038,#050508 60%)}#app{max-width:1120px;height:calc(100% - 32px);margin:16px auto;border-radius:24px;border:1px solid var(--bd);flex-direction:row-reverse}nav{flex-direction:column;justify-content:flex-start;gap:6px;width:220px;border-top:0;border-right:1px solid var(--bd);padding:28px 12px}nav div{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:12px;font-size:14px;width:100%}nav div i{display:inline;font-size:18px}nav div:hover{background:var(--card2)}nav .plus{width:100%;height:auto;border-radius:12px;margin:0 0 8px;box-shadow:none;font-size:16px}#main{padding:28px 40px}#main>*{max-width:780px;margin-left:auto;margin-right:auto}.two{grid-template-columns:repeat(3,1fr)}}
.pw{position:relative}.pw input{padding-right:46px}.eye{position:absolute;right:4px;top:3px;width:40px;height:40px;background:none;border:0;color:var(--mu);cursor:pointer;display:grid;place-items:center;border-radius:10px}.eye:focus-visible{outline:2px solid var(--pu2)}.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cp{position:relative;margin-bottom:10px}.cpb{width:100%;text-align:left;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:12px;color:#fff;font-size:15px;cursor:pointer}.cpl{position:absolute;z-index:5;left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-top:4px}#cpo{max-height:230px;overflow:auto}#cpo div{padding:10px 12px;cursor:pointer;font-size:14px}#cpo .hl,#cpo div:hover{background:var(--pu)}
html,body,#main{overflow-x:hidden}@media(max-width:380px){#main{padding:10px 12px 20px}}.err{border-color:var(--rd)!important}
body.auth{background:radial-gradient(circle at 50% 0,#1d1038,#0b0b12 60%) fixed}
#app.auth{max-width:none;width:100%;height:100%;margin:0;border:0;border-radius:0;box-shadow:none;background:transparent}#app.auth #main{display:flex;flex-direction:column;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
</style></head><body><div id="app"><div id="splash"><div class="sw"><span class="sn">DIRECT</span><svg class="sa" viewBox="0 0 90 40"><path d="M8 5l15 15-15 15"/><path d="M38 5l15 15-15 15"/><path d="M68 5l15 15-15 15"/></svg></div><div class="stg">Money. Business. Growth.</div></div><div id="main"></div><nav id="nav"></nav></div>
<script>
const S={inv:[{to:'james.taylor@email.com',a:120,st:'Paid'},{to:'sarah.miller@email.com',a:85,st:'Sent'}],subs:[{n:'Web hosting',a:15,e:'Monthly',on:1}],cards:[{t:'Visa',l:'4417'},{t:'First Bank',l:'0921',b:1}],disp:[{id:'D-2041',w:'mike@brand.com',a:60,st:'Open'}],links:[],sec:{tfa:1,alert:1,notif:1},q:'',tab:'home',view:'home',bal:5420,mode:'email',cart:0,size:10,cat:'All',period:'This Month',
tx:[['Payment from alex.john@email.com','Today, 10:24 AM',250],['Payment to sarahlee@email.com','Today, 09:15 AM',-120],['Payment from mike@brand.com','Yesterday, 11:45 PM',1000]]};
const $=s=>document.querySelector(s),fmt=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2});
const go=(v,t)=>{S.view=v;if(t)S.tab=t;render()};
const toast=m=>{const d=document.createElement('div');d.className='toast';d.textContent=m;$('#app').appendChild(d);setTimeout(()=>d.remove(),2200)};
const bar=(t,back)=>`<div class="bar">${back?`<button class="ib" onclick="go('${back}')">←</button>`:'<span></span>'}<span>${t}</span><span style="width:36px"></span></div>`;
const txs=()=>!S.tx.length?'<div class="mu">No transactions yet</div>':S.tx.map(x=>`<div class="li"><div class="av">${x[0][8]=='f'?'A':'S'}</div><div class="g">${x[0]}<div class="mu">${x[1]}</div></div><b class="${x[2]>0?'pos':'neg'}">${x[2]>0?'+':'-'}${fmt(Math.abs(x[2]))}</b></div>`).join('');
const prods=[['👟','Nike Air Force 1 \'07',110,'Shoes'],['👕','Essentials Hoodie',45,'Clothing'],['👟','Nike Air Max 270',120,'Shoes'],['🧥','Purple Hoodie',60,'Clothing'],['🎁','Gift Card Pack',25,'Gift Cards'],['👜','Tote Bag',35,'Accessories']];
const V={
home(){return `<div class="bar"><span style="width:36px"></span><span class="logo">DIRECT<b>»»</b></span><button class="ib" onclick="toast('No new notifications')">🔔</button></div>
<div class="mu">Good morning,</div><div style="font-weight:700;font-size:18px;margin-bottom:12px">${S.u.name} 👋</div><div class="mu" style="margin:-8px 0 12px">Account status: ${S.kyc?S.kyc.st:'Incomplete'}</div>
<div class="card"><div class="mu" style="cursor:pointer" role="button" tabindex="0" aria-label="Show or hide balance" onclick="S.hide=!S.hide;render()">Total Balance ${S.hide?'🙈':'👁'}</div><div class="big">${S.hide?'••••••':fmt(S.bal)}</div><div class="mu">Available Balance · USD</div>
<div class="row" style="margin-top:12px"><div class="act" onclick="go('receive')"><i>✉</i>Receive</div><div class="act" onclick="go('pay')"><i>➤</i>Pay</div><div class="act" onclick="go('request')"><i>⤓</i>Request</div><div class="act" onclick="go('more')"><i>⋯</i>More</div></div></div>
<div class="card promo"><div><b>Boost your business today! 🚀</b><div class="mu" style="margin:6px 0 10px">Promote your products and reach more customers worldwide.</div><button class="btn s" onclick="go('biz','biz')">Promote Now</button></div><span style="font-size:56px">🛍</span></div>
<h2>Quick Access<a>Edit</a></h2><div class="grid4">${[['🏪','My Store','biz'],['📦','Products','market'],['📊','Analytics','biz'],['👥','Customers','biz'],['💳','Payments','pay'],['⬆','Withdraw','pay'],['🎁','Gift Cards','gift'],['⋯','More','more']].map(q=>`<div class="act" onclick="go('${q[2]}')"><i>${q[0]}</i>${q[1]}</div>`).join('')}</div>
<h2 style="margin-top:16px">Recent Activity<a onclick="go('activity','activity')">View All</a></h2><div class="card">${txs()}</div>`},
pay(){const m=[['email','✉','Email','Pay using the recipient\'s email address'],['user','@','Username','Pay using their unique DIRECT username'],['phone','📞','Phone Number','Pay using the recipient\'s phone number'],['link','🔗','DIRECT Link','Pay using a DIRECT payment link']];
return bar('Pay','home')+`<div class="mu">Payment Mode</div><h2 style="font-size:20px;font-weight:500;margin:6px 0 14px">Choose how you want to pay</h2>`+m.map(o=>`<div class="opt ${S.mode==o[0]?'sel':''}" onclick="S.mode='${o[0]}';render()"><span class="ic">${o[1]}</span><div class="t"><b>${o[2]}</b>${o[3]}</div><div class="radio"></div></div>`).join('')+
`<input id="to" placeholder="Recipient (${S.mode})"><input id="amt" type="number" placeholder="Amount (USD)"><button class="btn" onclick="send()">Continue</button>
<h2 style="margin-top:16px">Recent Contacts<a>View All</a></h2><div class="card">${[...new Set(S.tx.filter(x=>x[0].startsWith('Payment to ')).map(x=>x[0].slice(11)))].slice(0,3).map(e=>[e,e]).map(c=>`<div class="li" onclick="$('#to').value='${c[1]}'"><div class="av">${c[0][0]}</div><div class="g">${c[0]}<div class="mu">${c[1]}</div></div></div>`).join('')}</div>`},
request(){return bar('Request','home')+`<input placeholder="From (email, username or phone)"><input type="number" placeholder="Amount (USD)"><input placeholder="Note (optional)"><button class="btn" onclick="toast('Request sent');go('home')">Send Request</button>`},
activity(){return bar('Activity')+`<div class="card">${txs()}</div>`},
market(){const l=prods.filter(p=>S.cat=='All'||p[3]==S.cat);return `<div class="bar"><button class="ib" onclick="go('home','home')">←</button><span>Marketplace</span><button class="ib" onclick="toast('Cart: '+S.cart+' item(s)')">🛒${S.cart?'<sup>'+S.cart+'</sup>':''}</button></div>
<input placeholder="🔍 Search for products, brands...">
<div class="chips">${['All','Clothing','Shoes','Gift Cards','Accessories'].map(c=>`<div class="chip ${S.cat==c?'on':''}" onclick="S.cat='${c}';render()">${c}</div>`).join('')}</div>
<div class="card promo"><div><b>New Arrivals</b><div style="color:var(--pu2);font-weight:700;margin:4px 0 10px">Up to 40% Off</div><button class="btn s">Shop Now</button></div><span style="font-size:56px">🧥</span></div>
<h2>Top Deals<a>View All</a></h2><div class="two">${l.map((p,i)=>`<div class="prod" onclick="S.p=${prods.indexOf(p)};go('prod')"><div class="im">${p[0]}</div>${p[1]}<br><b>${fmt(p[2])}</b></div>`).join('')}</div>`},
prod(){const p=prods[S.p||0];return bar('Product Details','market')+`<div class="card" style="text-align:center;font-size:110px">${p[0]}</div><h2 style="font-size:18px">${p[1]}</h2><div class="mu">Men's ${p[3]} · ⭐ 4.8 (230 reviews)</div>
<div style="display:flex;justify-content:space-between;margin:10px 0"><b style="font-size:22px">${fmt(p[2])}</b><span class="pos">In Stock</span></div><div class="mu">Select Size</div><div class="sz">${[7,8,9,10,11,12].map(s=>`<span class="${S.size==s?'on':''}" onclick="S.size=${s};render()">${s}</span>`).join('')}</div>
<button class="btn" style="background:var(--card2);margin-bottom:10px" onclick="S.cart++;toast('Added to cart');render()">Add to Cart</button><button class="btn" onclick="buy(${p[2]})">Buy Now</button><div class="mu" style="text-align:center;margin-top:12px">🔒 Secure Checkout · 🚚 Fast Delivery · ↩ Easy Returns</div>`},
gift(){const b=[['🅰','Amazon',10],['🎮','Steam',10],['🍎','Apple',10],['▶','Google Play',10],['🕹','PlayStation',10],['🎬','Netflix',10]];return bar('Gift Cards','home')+`<input placeholder="🔍 Search gift cards...">
<h2>Popular Brands<a>View All</a></h2><div class="grid4" style="grid-template-columns:repeat(3,1fr)">${b.map(x=>`<div class="act" onclick="buy(25,'${x[1]} gift card')"><i>${x[0]}</i>${x[1]}<div class="mu">Up to ${x[2]}% Off</div></div>`).join('')}</div>
<h2 style="margin-top:16px">How it works</h2><div class="card">${['Choose a gift card|Select from top brands worldwide','Pay securely|Complete payment using DIRECT','Get your code|Instant delivery to your email'].map((s,i)=>`<div class="li"><div class="av">${i+1}</div><div class="g"><b>${s.split('|')[0]}</b><div class="mu">${s.split('|')[1]}</div></div></div>`).join('')}</div>`},
biz(){const sales=S.tx.filter(x=>x[2]>0).reduce((a,x)=>a+x[2],0),pts=S.tx.length>1?S.tx.slice(0,8).reverse().map(x=>20+Math.min(70,Math.abs(x[2])/10)):[10,10],W=300,H=100,d=pts.map((y,i)=>`${i*W/7},${H-y}`).join(' ');
return `<div class="bar"><span></span><span>Business Dashboard</span><span class="chip on" onclick="S.period=S.period=='This Month'?'This Week':'This Month';render()">${S.period}</span></div>
<div class="card" style="background:linear-gradient(135deg,#3b1d8a,#1f1247)"><div class="mu">Total Sales</div><div class="big">${fmt(sales)}</div><div class="pos mu">Total received</div><svg viewBox="0 0 ${W} ${H+10}" width="100%"><polyline fill="none" stroke="#a855f7" stroke-width="3" points="${d}"/></svg></div>
<div class="row" style="margin-bottom:14px">${[['Payments in',S.tx.filter(x=>x[2]>0).length,''],['Invoices',S.inv.length,''],['Paid',S.inv.filter(v=>v.st=='Paid').length,'']].map(k=>`<div class="card" style="margin:0;padding:10px"><div class="mu">${k[0]}</div><b style="font-size:18px">${k[1]}</b><div class="pos mu">${k[2]}</div></div>`).join('')}</div>
<h2>Recent Orders<a>View All</a></h2><div class="card">${S.inv.filter(v=>v.st=='Paid').map(v=>[v.to,'Invoice',v.a]).map(o=>`<div class="li"><div class="av">${o[0][0].toUpperCase()}</div><div class="g">${o[0]}<div class="mu">${o[1]}</div></div><div style="text-align:right"><b>${fmt(o[2])}</b><div class="pos mu">Completed</div></div></div>`).join('')}</div>`},
banktx(){const B=['Access Bank','GTBank','First Bank','UBA','Zenith Bank','Opay','Kuda','Moniepoint','Palmpay','Fidelity Bank'];return bar('Transfer to bank','more')+`<select id="bB">${B.map(b=>`<option>${b}</option>`).join('')}</select><input id="bN" inputmode="numeric" maxlength="10" placeholder="Account number (10 digits)"><input id="bA" type="number" placeholder="Amount (USD)"><button class="btn" onclick="bankTx()">Transfer</button><div class="mu" style="margin-top:10px">Account-name lookup and real settlement need a bank-connected provider.</div>`},
customers(){const m={};S.tx.forEach(x=>{const k=x[0].replace(/^(Payment (to|from)|Transfer to|Payout to|Refund to) /,'');m[k]=(m[k]||0)+Math.abs(x[2])});S.inv.forEach(v=>{if(v.st=='Paid')m[v.to]=(m[v.to]||0)+v.a});return bar('Customers','more')+`<div class="card">${Object.entries(m).map(([k,v])=>`<div class="li"><div class="av">${k[0].toUpperCase()}</div><div class="g">${k}</div><b>${fmt(v)}</b></div>`).join('')||'<div class=mu>No customers yet</div>'}</div>`},
split(){return bar('Split Payments','more')+`<input id="xA" type="number" placeholder="Total amount (USD)"><div class="mu" style="margin-bottom:8px">One per line: email or @username, percent (must total 100)</div><textarea id="xL" rows="4" style="width:100%;background:var(--card2);border:1px solid var(--bd);border-radius:12px;color:#fff;padding:12px;margin-bottom:10px" placeholder="a@email.com, 70"></textarea><button class="btn" onclick="paySplit()">Pay & Split</button>`},
settle(){const l=S.tx.filter(x=>/^(Withdrawal|Transfer to)/.test(x[0]));return bar('Settlements','more')+`<div class="card">${l.map(x=>`<div class="li"><div class="g">${x[0]}<div class="mu">${x[1]}</div></div><b>${fmt(Math.abs(x[2]))}</b></div>`).join('')||'<div class=mu>No settlements yet</div>'}</div>`},
receive(){return bar('Receive','home')+`<div class="card" style="text-align:center">${qr(S.u.email)}<b>${S.u.name}</b><div class="mu">${S.u.email}</div><div class="mu">@${S.u.username}</div></div><div class="mu" style="text-align:center">Share your email or @username to get paid.</div>`},
more(){const m=[['🧾','Invoices','inv'],['🔗','Payment Links','links'],['🔁','Recurring','subs'],['💸','Payouts','payouts'],['🏦','Cards & Banks','cards'],['💱','Currency','fx'],['🛡','Disputes','disp'],['📈','Reports','rep'],['🔐','Security','sec'],['🏧','Bank Transfer','banktx'],['👥','Customers','customers'],['🔀','Split Payments','split'],['🧾','Settlements','settle']];return bar('More','home')+`<div class="grid4" style="grid-template-columns:repeat(3,1fr)">${m.map(x=>`<div class="act" onclick="go('${x[2]}')"><i>${x[0]}</i>${x[1]}</div>`).join('')}</div>`},

newinv(){return bar('New Invoice','inv')+`<input id="iT" placeholder="Customer email"><input id="iD" placeholder="Description"><input id="iA" type="number" placeholder="Amount (USD)"><button class="btn" onclick="mkInv()">Send Invoice</button>`},
